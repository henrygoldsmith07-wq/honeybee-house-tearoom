<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found — Honeybee House Tearoom</title>
<style>
  :root{--base:#f7f4eb;--surface:#fffdf8;--text:#2c3b34;--secondary:#59665b;--accent:#455f4e;--rule:#d8dcd0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.65}
  main{max-width:34rem;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:clamp(28px,5vw,48px)}
  .brand{font:500 1.4rem/1.1 Georgia,serif;letter-spacing:-.01em;margin:0 0 8px}
  .place{font-size:.8rem;letter-spacing:.04em;color:var(--secondary);margin:0 0 32px}
  h1{font:500 clamp(28px,4vw,40px)/1.15 Georgia,serif;letter-spacing:-.02em;margin:0 0 16px}
  p{margin:0 0 24px;color:var(--secondary)}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:3px;font-size:.95rem;font-weight:500;text-decoration:none;border:1px solid transparent}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(.9)}
  .btn-outline{background:transparent;color:var(--text);border-color:var(--rule)}
  a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <p class="brand">Honeybee House</p>
  <p class="place">Tearoom · Llanishen</p>
  <h1>Page not found</h1>
  <p>That page isn't here. Head back to the tearoom website, or call 029 2075 5380 to ask about a table.</p>
  <div class="actions">
    <a class="btn btn-primary" href="./">Back to the website</a>
    <a class="btn btn-outline" href="tel:+442920755380">Call the tearoom</a>
  </div>
</main>
</body>
</html>
